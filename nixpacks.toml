# O ffmpeg entra na imagem por causa da fita de corte.
#
# Antes, mexer nos punhos mandava o gravador da sua máquina refazer o clipe a
# partir da gravação original, e você esperava o arquivo ir e voltar. Agora a
# fita só anota o trecho, e quem recorta é o servidor, na hora de publicar ou
# baixar — para isso ele precisa do ffmpeg aqui dentro.
#
# aptPkgs, e não nixPkgs: nixPkgs SUBSTITUI a lista que o nixpacks montou
# sozinho para o Python, e trocar essa lista quebraria o build inteiro. O
# aptPkgs acrescenta.
#
# A FONTE DE EMOJI entra pela mesma porta, por causa das bandeirinhas da arte
# de escalação: "as bandeiras dos jogadores tem que ser de emoji" (23/10/26).
# O PNG do flagcdn reduzido a 40px faz a shahada da bandeira saudita virar um
# borrão; o emoji é desenhado para ser lido nesse tamanho.
#
# Sem o pacote a arte não quebra — a bandeira volta a ser a imagem baixada.
# `/api/diag/saude` diz qual dos dois está valendo.
[phases.setup]
aptPkgs = ["ffmpeg", "fonts-noto-color-emoji"]
